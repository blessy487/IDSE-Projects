<style>

<div id="app">
<div id="hud"><div id="mis"></div><div class="st">⭐ <b id="sc">0</b></div><div class="st">XP <b id="xp">0</b></div><div class="st" id="lv"></div><div class="ox"><i id="oxb"></i><span>O₂</span></div>

<script>
(()=>{
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),W=900,H=520,EF='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
/* ================= SIMULATED DATASET ================= */
let sd=7;const rnd=()=>(sd=(sd*1664525+1013904223)%4294967296)/4294967296,gs=()=>(rnd()+rnd()+rnd()+rnd()-2)*1.7;
const RN=["Coral Bay","Kelp Coast","Reef Gate","Harbor Mouth","Plastic Gyre","Deep Blue"],PB=[18,25,20,45,70,12],TB=[22,19,24,23,26,17];
const raw=[];
for(let i=0;i<114;i++){const r=i%6,p=Math.max(2,PB[r]+i*.2+gs()*7),t=TB[r]+gs()*1.2+p*.01,o=8.5-.03*p+gs()*.35-(t-20)*.08,m=Math.round(520-3.2*p+gs()*25),z=(p-42)/12+(6.3-o)*1.2+(t-24)*.4+gs()*.5;
 raw.push({id:r+1,t:+t.toFixed(1),o:+o.toFixed(2),p:+p.toFixed(1),m,h:z>0?"At Risk":"Healthy"});}
[[3,190],[12,210],[22,175]].forEach(([i,p])=>{raw[i].p=p;raw[i].o=4.1;raw[i].m=120;raw[i].h="At Risk"}); // outliers
raw[10].o=null;raw[20].t=null;raw[31].m=null;raw[44].o=null;raw[50].o=-4; // missing + incorrect
raw.push({...raw[5]},{...raw[15]},{...raw[25]}); // duplicates (117 raw records)
const seen=new Set(),dd=raw.filter(r=>{const k=JSON.stringify(r);if(seen.has(k))return false;seen.add(k);return true});
const sum=a=>a.reduce((x,y)=>x+y,0),mean=a=>sum(a)/a.length,sdv=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const med=a=>{a=[...a].sort((x,y)=>x-y);const n=a.length,h=n>>1;return n%2?a[h]:(a[h-1]+a[h])/2};
const q=(a,p)=>{a=[...a].sort((x,y)=>x-y);const i=(a.length-1)*p,l=Math.floor(i);return a[l]+(a[Math.min(l+1,a.length-1)]-a[l])*(i-l)};
const corr=(x,y)=>{const mx=mean(x),my=mean(y);return sum(x.map((v,i)=>(v-mx)*(y[i]-my)))/Math.sqrt(sum(x.map(v=>(v-mx)**2))*sum(y.map(v=>(v-my)**2)))};
const okv=(k,r)=>r[k]!=null&&!(k=='o'&&r[k]<0),MED={};['t','o','p','m'].forEach(k=>MED[k]=med(dd.filter(r=>okv(k,r)).map(r=>r[k])));
const D=dd.map(r=>{const c={...r};['t','o','p','m'].forEach(k=>{if(!okv(k,r))c[k]=+MED[k].toFixed(2)});return c}); // cleaned dataset
const regs=RN.map((n,i)=>{const r=D.filter(x=>x.id==i+1),f=k=>mean(r.map(x=>x[k]));return{n,t:f('t'),o:f('o'),p:f('p'),m:f('m'),pr:0}});
/* ---- Linear regression y=mx+c on survey means ---- */
const survey=[];for(let b=0;b<9;b++)survey.push(mean(D.slice(b*12,b*12+12).filter(r=>r.p<120).map(r=>r.p)));
const LIN=(()=>{const x=survey.map((_,i)=>i+1),mx=mean(x),my=mean(survey),m=sum(x.map((v,i)=>(v-mx)*(survey[i]-my)))/sum(x.map(v=>(v-mx)**2)),c=my-m*mx,pr=x.map(v=>m*v+c);
 return{m,c,mae:mean(survey.map((y,i)=>Math.abs(y-pr[i]))),r2:1-sum(survey.map((y,i)=>(y-pr[i])**2))/sum(survey.map(y=>(y-my)**2))}})();
/* ---- Logistic regression: sigmoid + gradient descent ---- */
const F=['t','o','p'],mu=F.map(k=>mean(D.map(r=>r[k]))),sg=F.map(k=>sdv(D.map(r=>r[k]))),norm=v=>v.map((x,i)=>(x-mu[i])/sg[i]),sig=z=>1/(1+Math.exp(-z));
const XA=D.map(r=>norm(F.map(k=>r[k]))),Y=D.map(r=>r.h=="At Risk"?1:0),tr=[],te=[];D.forEach((_,i)=>(i%5==4?te:tr).push(i));
let W3=[0,0,0],B0=0,LOG={};
const pz=z=>sig(B0+z.reduce((s,x,j)=>s+x*W3[j],0)),prob=(t,o,p)=>pz(norm([t,o,p]));
function train(){W3=[0,0,0];B0=0;for(let e=0;e<600;e++){const gw=[0,0,0];let gb=0;tr.forEach(i=>{const er=pz(XA[i])-Y[i];XA[i].forEach((x,j)=>gw[j]+=er*x);gb+=er});W3=W3.map((w,j)=>w-.3*gw[j]/tr.length);B0-=.3*gb/tr.length}
 const acc=ix=>mean(ix.map(i=>(pz(XA[i])>.5?1:0)==Y[i]?1:0)),loss=-mean(tr.map(i=>Y[i]*Math.log(pz(XA[i])+1e-9)+(1-Y[i])*Math.log(1-pz(XA[i])+1e-9)));
 regs.forEach(r=>r.pr=prob(r.t,r.o,r.p));LOG={tr:acc(tr),te:acc(te),loss,w:[...W3],b:B0};return LOG}
train();
/* ================= STATE ================= */
const KEY='oceanrescue_v1';let save;try{save=JSON.parse(localStorage[KEY])}catch(e){}save=save||{u:1,res:{},badges:[]};
const persist=()=>{try{localStorage[KEY]=JSON.stringify(save)}catch(e){}};
const LV=[["Ocean Explorer","Collect 5 water samples (SPACE near a bottle)","Data collection"],["Clean the Data","Fix missing values, duplicates, wrong readings","Data cleaning"],["Ocean Investigation","Explore regions: mean, median, correlation","EDA & statistics"],["Pollution Detective","Find outliers with IQR & Z-score","Outlier detection"],["Visualisation Lab","Choose the right graph","Data visualisation"],["Marine AI Prediction","Linear & logistic regression","Machine learning"],["Final Mission","Save the ocean with data-driven decisions","Full workflow"]];
const BADGE={0:['🧪','First Sample'],1:['🧹','Data Cleaner'],2:['📈','Statistician'],3:['🔍','Pollution Detective'],4:['📊','Chart Master'],5:['🤖','AI Predictor'],6:['🐢','Turtle Savior']};
const S={lv:0,mode:'menu',pts:0,lives:3,o2:100,samples:0,rescued:0,paused:false,t:0,clean:0,wt:0};
const tot=()=>Object.values(save.res).reduce((s,r)=>s+r.pts,0),oth=()=>Object.keys(save.res).filter(k=>k!=S.lv).reduce((s,k)=>s+save.res[k].pts,0);
const xpv=()=>Math.floor(tot()/2)+Object.keys(save.res).length*50,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),f2=(v,n=2)=>(+v).toFixed(n);
const inPlay=()=>['play','over','win'].includes(S.mode);
/* ================= AUDIO ================= */
let AC,mute=0;
const tone=(f,d=.15,ty='sine',v=.07)=>{if(mute)return;try{AC=AC||new AudioContext();AC.resume();const o=AC.createOscillator(),n=AC.createGain();o.type=ty;o.frequency.value=f;n.gain.value=v;o.connect(n);n.connect(AC.destination);o.start();n.gain.exponentialRampToValueAtTime(1e-4,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}};
const jingle=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25),i*110));
setInterval(()=>{if(S.mode!='menu')tone([262,330,392,440,523,392][Math.floor(T*.9)%6],.9,'sine',.018)},900);
/* ================= UI HELPERS ================= */
const ov=$('#ov'),panel=h=>{ov.innerHTML=h?`<div class="pn">${h}</div>`:'';ov.style.display=h?'flex':'none'};
let tt;const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',3800)};
const badge=i=>{const b=BADGE[i];if(b&&!save.badges.includes(b[1])){save.badges.push(b[1]);toast(`🏅 Badge unlocked: ${b[0]} ${b[1]}`)}};
function hud(){const pl=inPlay()||S.mode=='lab'||S.mode=='done';$('#sc').textContent=pl?oth()+S.pts:tot();$('#xp').textContent=xpv();
 $('#lv').textContent='❤'.repeat(Math.max(0,S.lives))+'🖤'.repeat(Math.max(0,3-S.lives));$('#oxb').style.width=clamp(S.o2,0,100)+'%';$('#oxb').style.background=S.o2<25?'#ff5e5e':'';
 let m='Welcome, explorer!';if(pl){m=`L${S.lv+1} ${LV[S.lv][0]}: `+(S.mode=='play'||S.mode=='over'?(S.lv==0?`🧪 ${S.samples}/5 samples · SPACE near bottle`:`🧪 ${S.samples}/5 · 🐢 hold SPACE near turtle (${turtle&&turtle.done?'rescued ✔':'trapped'})`):S.mode=='win'?'Restoring the ocean…':LV[S.lv][1])}
 $('#mis').textContent=m;$('#hud').style.visibility=['menu','select'].includes(S.mode)?'hidden':'visible'}
/* ================= WORLD ================= */
let items=[],jel=[],rocks=[],dv,turtle=null,T=0,bubs=[];
const fish=Array.from({length:10},(_,i)=>({x:rnd()*W,y:90+rnd()*340,v:(rnd()<.5?-1:1)*(25+rnd()*40),e:['🐠','🐟','🐡','🐠'][i%4],s:22+rnd()*14,ph:rnd()*6}));
const amb=Array.from({length:30},()=>({x:rnd()*W,y:rnd()*H,r:2+rnd()*5,v:20+rnd()*30,ph:rnd()*6}));
const cor=Array.from({length:14},(_,i)=>({x:30+i*65+rnd()*30,h:25+rnd()*45,col:['#ff6b9d','#ff9f43','#b565f0','#ff5e5e'][i%4]})),wd=Array.from({length:12},(_,i)=>({x:20+i*78+rnd()*30,h:50+rnd()*50}));
function initWorld(lv){const R=(a,b)=>a+rnd()*(b-a);items=[];jel=[];bubs=[];
 for(let i=0;i<5;i++)items.push({k:'s',x:110+i*165+R(-30,30),y:R(130,420),on:1});
 for(let i=0;i<(lv?9:6);i++)items.push({k:'p',x:R(60,840),y:R(110,440),on:1,e:['🛍️','🥤','🍾','🥫'][i%4]});
 for(let i=0;i<3;i++)items.push({k:'a',x:R(100,800),y:R(150,420),on:1});
 for(let i=0;i<(lv?4:3);i++)jel.push({x:150+i*200+R(0,80),by:R(190,370),a:R(1,2),ph:R(0,6),vx:R(-25,25)||18,y:0});
 rocks=[{x:250,y:480,r:34},{x:520,y:490,r:42},{x:760,y:475,r:30}];turtle=lv?{x:450,y:300,p:0,done:0}:null;dv={x:60,y:80,vx:0,vy:0,f:1,inv:0}}
function sampleRow(n){return lvIs7()?D.filter(r=>r.id==5)[n*3]:D[(n*17+3)%D.length]}const lvIs7=()=>S.lv==6;
function act(){let b=null,bd=58;items.forEach(i=>{if(!i.on||i.k=='a')return;const d=Math.hypot(dv.x-i.x,dv.y-i.y);if(d<bd){bd=d;b=i}});if(!b)return;b.on=0;
 if(b.k=='s'){S.samples++;S.pts+=50;tone(880,.2);const r=sampleRow(S.samples);toast(`🧪 Sample ${S.samples}/5 · ${RN[r.id-1]} · Temp ${r.t}°C · O₂ ${r.o} mg/L · Plastic ${r.p} units`)}else{S.pts+=10;tone(500,.1)}}
function hurt(oxy){if(S.mode!='play')return;S.lives--;dv.inv=1.6;tone(120,.35,'sawtooth',.1);if(oxy){S.o2=100;dv.x=60;dv.y=80;toast('Out of air! Surface to refill oxygen.')}else S.o2=Math.max(1,S.o2-10);
 if(S.lives<=0){S.mode='over';panel('<h2>💔 Out of lives</h2><p>The ocean still needs you!</p><button class="b" data-a="retry">Try again</button><button class="b2" data-a="menu">Level select</button>')}}
function upd(dt){S.t+=dt;const k=keys,tx=((k.ArrowRight?1:0)-(k.ArrowLeft?1:0))*190,ty=((k.ArrowDown?1:0)-(k.ArrowUp?1:0))*170;
 dv.vx+=(tx-dv.vx)*Math.min(1,dt*7);dv.vy+=(ty-dv.vy)*Math.min(1,dt*7);dv.x=clamp(dv.x+dv.vx*dt,22,W-22);dv.y=clamp(dv.y+dv.vy*dt,30,H-50);if(tx)dv.f=Math.sign(tx);dv.inv=Math.max(0,dv.inv-dt);
 if(dv.y<62)S.o2=Math.min(100,S.o2+45*dt);else S.o2-=2.2*dt;if(S.o2<=0)hurt(1);
 rocks.forEach(r=>{const dx=dv.x-r.x,dy=dv.y-r.y,d=Math.hypot(dx,dy)||1;if(d<r.r+14){dv.x=r.x+dx/d*(r.r+14);dv.y=r.y+dy/d*(r.r+14)}});
 jel.forEach(j=>{j.x+=j.vx*dt;if(j.x<60||j.x>840)j.vx*=-1;j.y=j.by+Math.sin(S.t*j.a+j.ph)*85;if(!dv.inv&&Math.hypot(dv.x-j.x,dv.y-j.y)<30)hurt()});
 items.forEach(i=>{if(i.on&&i.k=='a'&&Math.hypot(dv.x-i.x,dv.y-i.y)<30){i.on=0;S.o2=Math.min(100,S.o2+35);tone(700,.12)}});
 if(turtle){if(turtle.done)turtle.x+=90*dt;else if(keys.Space&&Math.hypot(dv.x-turtle.x,dv.y-turtle.y)<80){turtle.p+=dt/1.6;if(turtle.p>=1){turtle.done=1;S.rescued=1;S.pts+=150;jingle();toast('🐢 Turtle rescued! +150')}}else turtle.p=Math.max(0,turtle.p-dt*.5)}
 if(Math.random()<dt*2.5)bubs.push({x:dv.x+dv.f*22,y:dv.y-8,r:2+Math.random()*3,life:2});bubs.forEach(b=>{b.y-=50*dt;b.life-=dt});bubs=bubs.filter(b=>b.life>0);
 if(S.mode=='play'&&S.samples>=5&&(S.lv==0||turtle.done))setTimeout(()=>S.lv==0?done(0,'You collected all the water samples. Data collection complete!'):dec7(),S.lv==0?0:900),S.mode='pend'}
/* ================= RENDER ================= */
function em(e,x,y,s,fl=1,rot=0){g.save();g.translate(x,y);g.scale(fl,1);g.rotate(rot);g.font=s+'px '+EF;g.textAlign='center';g.textBaseline='middle';g.fillText(e,0,0);g.restore()}
function bg(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1fb5c9');gr.addColorStop(.35,'#0b6fa8');gr.addColorStop(1,'#031a45');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.save();g.globalAlpha=.08;g.fillStyle='#fff';for(let i=0;i<5;i++){const x=i*210+Math.sin(T*.3+i)*40;g.beginPath();g.moveTo(x,0);g.lineTo(x+60,0);g.lineTo(x+180,H);g.lineTo(x+60,H);g.fill()}g.restore();
 g.fillStyle='rgba(255,255,255,.3)';g.beginPath();g.moveTo(0,0);for(let x=0;x<=W;x+=20)g.lineTo(x,12+Math.sin(x*.05+T*2)*4);g.lineTo(W,0);g.fill();
 g.fillStyle='#d8b37a';g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=30)g.lineTo(x,495+Math.sin(x*.02)*6);g.lineTo(W,H);g.fill();
 g.lineCap='round';g.lineWidth=5;wd.forEach(w=>{g.strokeStyle='#2fbf71';g.beginPath();g.moveTo(w.x,497);g.quadraticCurveTo(w.x+Math.sin(T+w.x)*14,497-w.h*.5,w.x+Math.sin(T*1.2+w.x)*20,497-w.h);g.stroke()});
 cor.forEach(c=>{g.strokeStyle=g.fillStyle=c.col;g.lineWidth=7;for(let b=-1;b<=1;b++){g.beginPath();g.moveTo(c.x,497);g.quadraticCurveTo(c.x+b*14,497-c.h*.6,c.x+b*26,497-c.h-Math.abs(b)*10);g.stroke();g.beginPath();g.arc(c.x+b*26,497-c.h-Math.abs(b)*10,6,0,7);g.fill()}})}
function decor(dt){fish.forEach(f=>{f.x+=f.v*dt;if(f.x<-40)f.x=W+40;if(f.x>W+40)f.x=-40;em(f.e,f.x,f.y+Math.sin(T*2+f.ph)*8,f.s,f.v>0?-1:1)});
 amb.forEach(b=>{b.y-=b.v*dt;if(b.y<-10){b.y=H+10;b.x=rnd()*W}g.strokeStyle='rgba(200,250,255,.6)';g.lineWidth=1.5;g.beginPath();g.arc(b.x+Math.sin(T+b.ph)*8,b.y,b.r,0,7);g.stroke()});
 em('🐬',(T*70)%1200-150,110+Math.sin(T)*25,46,-1)}
function jellyD(j){g.save();g.translate(j.x,j.y);g.fillStyle='rgba(255,120,200,.75)';g.beginPath();g.ellipse(0,0,24,18,0,Math.PI,0);g.fill();g.strokeStyle='rgba(255,160,220,.8)';g.lineWidth=3;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*9,0);g.quadraticCurveTo(i*9+Math.sin(T*4+i)*8,14,i*9,30);g.stroke()}g.restore()}
function diverD(){const{x,y,f}=dv;g.save();g.translate(x,y);g.scale(f,1);if(dv.inv&&Math.floor(T*12)%2)g.globalAlpha=.4;g.rotate(clamp(dv.vy/300,-.5,.5));
 const k=Math.sin(T*10)*(Math.abs(dv.vx)+Math.abs(dv.vy)>20?1:.3)*7;g.fillStyle='#ffd23f';g.beginPath();g.ellipse(-32,k,13,4.5,0,0,7);g.fill();g.beginPath();g.ellipse(-32,4-k,13,4.5,0,0,7);g.fill();
